
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE ADVENTURE OF STARGAZING</title>
  <link rel="stylesheet" href="style.css">
</head>

<div class="star-trails" aria-hidden="true">
  <span class="orbit orbit-one"></span>
  <span class="orbit orbit-two"></span>
  <span class="orbit orbit-three"></span>
</div>

<body>
  <main class="gallery">

    <header class="intro">
      <p class="eyebrow">THE ADVENTURE OF STARGAZING</p>
      <h1>THE ADVENTURE<br>OF STARGAZING</h1>
      <p class="description">
        Move closer. Discover the unknown.
      </p>
      <p class="instruction">MOVE YOUR CURSOR TO EXPLORE</p>
    </header>

    <section class="items" aria-label="Museum collection">

      <!-- Object 01 -->
      <article class="item">
        <div class="image-wrap">
          <img
            src="image (25).png"
            alt="An antique key"
          >
        </div>
        <div class="item-info">
          <span>OBJECT 01</span>
          <h2>The Forgotten Key</h2>
          <p>A key to a forgotten place.</p>
        </div>
      </article>

      <!-- Object 02 -->
      <article class="item">
        <div class="image-wrap">
          <img
            src="image 26.png"
            alt="An ancient ceramic vessel"
          >
        </div>
        <div class="item-info">
          <span>OBJECT 02</span>
          <h2>The Silent Vessel</h2>
          <p>Echoes of another time.</p>
        </div>
      </article>

      <!-- Object 03 -->
      <article class="item">
        <div class="image-wrap">
          <img
            src="27.png"
            alt="An antique pocket watch"
          >
        </div>
        <div class="item-info">
          <span>OBJECT 03</span>
          <h2>Time Suspended</h2>
          <p>A moment that never ends.</p>
        </div>
      </article>

    </section>

    <footer>
      <p>STARS.</p>
    </footer>

  </main>
</body>
</html>
